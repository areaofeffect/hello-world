<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sketch</title>

    <link rel="stylesheet" type="text/css" href="style.css">

    <script src="libraries/p5.min.js"></script>
    <!-- p5.sound only works on https or localhost. On plain http it stops
         p5 from starting at all, so only load it on a secure origin. -->
    <script>
      if (window.isSecureContext) {
        document.write('<script src="libraries/p5.sound.min.js"><\/script>');
      }
    </script>
  </head>

  <body>
    <script src="sketch.js"></script>
  </body>
</html>
