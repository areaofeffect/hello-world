<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>One button golf - Hello World week 7</title>

    <link rel="stylesheet" type="text/css" href="style.css">

    <script src="libraries/p5.min.js"></script>
    <!-- p5.sound only works on https or localhost. On plain http it stops
         p5 from starting at all, so only load it on a secure origin. -->
    <script>
      if (window.isSecureContext) {
        document.write('<script src="libraries/p5.sound.min.js"><\/script>');
      }
    </script>
  </head>

  <body>
    <!-- the bar above the sketch: name, what to do, fullscreen button, link to the code -->
    <header class="bar">
      <div>
        <strong>One button golf</strong>
        <span class="hint">Press space</span>
      </div>
      <nav>
        <button id="fullscreen-button">Fullscreen</button>
        <a href="https://github.com/areaofeffect/hello-world/tree/main/week7/examples/p5/one-button-golf-like">source</a>
      </nav>
    </header>

    <!-- p5 adds the <canvas> here, after the header -->
    <script src="sketch.js"></script>

    <script>
      // Fullscreen button: ask the browser to show this page fullscreen.
      // The sketch's windowResized() then fits the canvas to the screen.
      // Press Escape to leave fullscreen again.
      document.getElementById("fullscreen-button").onclick = function () {
        document.documentElement.requestFullscreen();
        this.blur(); // give keyboard focus back to the sketch
      };
    </script>
  </body>
</html>
