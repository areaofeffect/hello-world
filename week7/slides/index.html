# Mouse Events

Computer mice and other related input devices typically have between one and three buttons; p5 can detect when these buttons are pressed with the mouseIsPressed and mouseButton variables. Used with the button status, the cursor position enables the mouse to perform different actions. For example, a button press when the mouse is over an icon can select it, so the icon can be moved to a different location on screen. The mouseIsPressed variable is true if any mouse button is pressed and false if no mouse button is pressed. The variable mouseButton is LEFT, CENTER, or RIGHT depending on the mouse button most recently pressed. The mouseIsPressed variable reverts to false as soon as the button is released, but the mouseButton variable retains its value until a different button is pressed. These variables can be used independently or in combination to control the software. Run these programs to see how the software responds to your mouse (computer) or fingers (mobile).

# Mouse position

The p5 variables mouseX and mouseY (note the capital X and Y) store the x-coordinate and y-coordinate of the cursor relative to the origin in the upper-left corner of the display window. To see the actual values produced while moving the mouse, run this program to print the values to the console:

[position example](http://hello-world-week7.s3-website-us-east-1.amazonaws.com/examples/p5/mouse-position/) ([source](https://github.com/areaofeffect/hello-world/tree/main/week7/examples/p5/mouse-position))

```javascript

function draw() {
  background(127);
  fill(0,0,255);
  rect(xPos, yPos, 25, 25);
  text("x: " + int(mouseX) + " y: " + int(mouseY), 0, 10);
}

function mouseMoved() {
  // capture the mouse positions into our variables
  xPos = mouseX;
  yPos = mouseY;
}
```

# Mouse position and mapping

The mouse position is most commonly used to control the location of visual elements on screen. More interesting relations are created when the visual elements relate differently to the mouse values, rather than simply mimicking the current position. Adding and subtracting values from the mouse position creates relationships that remain constant, while multiplying and dividing these values creates changing visual relationships between the mouse position and the elements on the screen. The square below has it's rotation directly mapped to the cursor.

[mapping example](http://hello-world-week7.s3-website-us-east-1.amazonaws.com/examples/p5/mouse-mapping/) ([source](https://github.com/areaofeffect/hello-world/tree/main/week7/examples/p5/mouse-mapping))

```javascript
function draw() {
  background(127)

  translate(width/2, height/2); // translation to center
  var mappedValueX = map(mouseX, 0, 200, 0, 2*PI); // map the mouse X position to radians
  var mappedValueY = map(mouseY, 0, 200, 0, 5); // map the mouse Y position to scale
  scale(mappedValueY); // scale the sketch based on mouse position
  rotate(mappedValueX); // rotate the sketch based on the mouse position

  // draw the rectangle
  fill(255,255,0);
  rect(0, 0, 50, 50);
}
```

# Rectangular Buttons

The most common type of bounding box is a rectangle. Our mouse is inside a rectangle when `mouseX` and `mouseY` are inside it's bounds.

The bounds of a rectangle can be thought of like its area.

- x position of the rectangle plus the rectangles width
- y position of the rectangle plus the rectangles height

# Handling keyboard inputs

p5 registers the most recently pressed key and whether a key is currently pressed. The boolean variable keyIsPressed is true if a key is pressed and is false if not. Include this variable in the test of an if structure to allow lines of code to run only if a key is pressed. The keyIsPressed variable remains true while the key is held down and becomes false only when the key is released.

```javascript
function setup() {
  createCanvas(200, 200);
  fill(245, 123, 158);
  textSize(50);
}

function draw() {
  background(200);
  text(key, 65, 65); // Display last key pressed.
}
```

# Handling keyboard inputs

In addition to reading key values for numbers, letters, and symbols. If you're making cross-platform projects, note that the Enter key is commonly used on PCs and UNIX and the Return key is used on Macintosh. Check for both Enter and Return to make sure your program will work for all platforms.

*The variable keyCode is used to detect special keys such as BACKSPACE, DELETE, ENTER, RETURN, TAB, ESCAPE, SHIFT, CONTROL, OPTION, ALT, UP_ARROW, DOWN_ARROW, LEFT_ARROW, RIGHT_ARROW You can also check for custom keys by looking up the keyCode of any key on a site like this: [https://www.toptal.com/developers/keycode](https://www.toptal.com/developers/keycode)*

```
if (keyCode == UP_ARROW) {
  y += 1;
}
```

# Handling keyboard inputs

This example works with an uppercase A, but not if the lowercase letter is pressed. To check for both uppercase and lowercase letters, extend the relational expression with a logical OR, the || relational operator. Line 4 in the previous program would be changed to:

keyIsPressed:

```javascript
function draw() {
  background(0);
  // If the 'A' key is pressed fill white
  if ((keyIsPressed == true) && (key == 'A')) {
    fill(255);
  } else {
     // otherwise, fill black
    fill(0);
  }
}
```

example conditional:
```
if ((keyIsPressed == true) && ((key == 'a') || (key == 'A'))) {
  // your code here
}
```

# ASCII Table

Because each character has a numeric value as defined by the ASCII table, the value of the key variable can be used like any other number to control visual attributes such as the position and color of shape elements. For instance, the ASCII table defines the uppercase A as the number 65, and the digit 1 is defined as 49.

# Simple movement

[simple movement example](http://hello-world-week7.s3-website-us-east-1.amazonaws.com/examples/p5/keyboard-movement/) ([source](https://github.com/areaofeffect/hello-world/tree/main/week7/examples/p5/keyboard-movement))

```javascript
function keyPressed(){
  // UP key
  if(keyCode == UP_ARROW) {
    ypos = ypos - numPixels; 
  }
 
  // DOWN key
  if(keyCode == DOWN_ARROW) { 
    ypos = ypos + numPixels; 
  }
 
  // RIGHT key
  if(keyCode == RIGHT_ARROW) {
    xpos = xpos + numPixels; 
  }
 
  // LEFT key
  if(keyCode == LEFT_ARROW) {
    xpos = xpos - numPixels; 
  }

  return false;
}
```

# Movement + Easing

[movement + easing example](http://hello-world-week7.s3-website-us-east-1.amazonaws.com/examples/p5/keyboard-movement-smoothing/) ([source](https://github.com/areaofeffect/hello-world/tree/main/week7/examples/p5/keyboard-movement-smoothing))

```javascript
function calculateEasing() {
  let dx = targetX - xpos;
  xpos += dx * easing;
  
  let dy = targetY - ypos;
  ypos += dy * easing;
}
```

# Movement + Gameobject

[movement + game object example](http://hello-world-week7.s3-website-us-east-1.amazonaws.com/examples/p5/keyboard-movement-objects/) ([source](https://github.com/areaofeffect/hello-world/tree/main/week7/examples/p5/keyboard-movement-objects))

```javascript
class GameObject {
  constructor() {
    this.x = width / 2;
    this.y = height / 2;
    this.hmom = 0;   // horizontal momentum
    this.vmom = 0;   // vertical momentum
    this.speed = 10;
    this.size = 25;
  }

  update() {
    this.move();
    this.render();
  }

  move() {
    this.x += this.hmom;
    this.y += this.vmom;

    // dampening: lose 10% of the momentum every frame
    this.hmom *= 0.9;
    this.vmom *= 0.9;

    this.checkCollisions();
  }
}
```

# Crossfading Images

[crossfading images example](http://hello-world-week7.s3-website-us-east-1.amazonaws.com/examples/p5/images-crossfade/) ([source](https://github.com/areaofeffect/hello-world/tree/main/week7/examples/p5/images-crossfade))

```javascript
var img;
var img2;

function preload() {
  img = loadImage("img/sva.jpg");
  img2 = loadImage("img/cat.jpg");
}

function setup(){
  createCanvas(200, 200);
}

function draw(){
  background(200);
  // background image, tint() sticks between frames so clear it
  noTint();
  image(img2, 0, 0, 200, 200);

  // second image, fade it in as the mouse moves right
  var alpha = map(mouseX, 0, width, 0, 255);
  tint(255, alpha);
  image(img, 0, 0, 200, 200);
}
```

# Screen space vs world space

So far "where is the mouse" and "where is the object" use the same numbers: pixels from the top left of the canvas.

Once you `translate()` or `rotate()` the canvas, or switch to `WEBGL`, the object lives in a *world* with its own origin while the mouse still lives on the *screen*. To hit test, convert one into the other.

# Debugging: open the console

Every browser has a developer console. Keep it open while you code.

- Chrome on Mac: `Cmd + Option + J`
- Chrome on Windows: `Ctrl + Shift + J`
- Or right click the page, Inspect, then the Console tab

`console.log()` prints anything you give it. Label your values so you know what you are looking at.

```javascript
function mousePressed() {
  console.log("pressed at", mouseX, mouseY);
}

function draw() {
  // draw() runs 60 times a second, so only log every 60th frame
  if (frameCount % 60 == 0) {
    console.log("player", player.x, player.y);
  }
}
```

class: inverse, left, top

# Debugging: read the error

Red text in the console is an error. It names the file and the line number. Click it. The three you will see most:

- `ReferenceError: score is not defined`
  A typo, or a variable declared inside one function and used in another.

- `TypeError: Cannot read properties of undefined`
  You asked for `player.x` but `player` does not exist yet. Find where it is created.

- `404 (Not Found)` in the Network tab
  A `loadImage()` path is wrong. Paths are relative to `index.html`, so `loadImage("static/img/cat.jpg")` fails when the file is at `img/cat.jpg`.

# Debugging: put your state on screen

When a game "does nothing", it is usually in a state you did not expect. Draw the state every frame so you can see it. The golf example does this in `displayInfo()`:

```javascript
function displayInfo() {
  textSize(10);
  fill(255);
  text("launchstate: " + launchstate, 10, 20);
  text("angle: " + abs(capturedLaunchAngle), 10, 30);
  text("speed : " + capturedLaunchSpeed, 10, 40);
}
```

Hide it behind a `debug` variable (or delete it) when you ship.

# Debugging: slow things down

Sixty frames a second is too fast to watch.

- `frameRate(5);` in `setup()` plays the sketch in slow motion
- `noLoop();` freezes it, `redraw();` draws one frame, `loop();` resumes
- `debugger;` on any line pauses the browser there. The Sources tab then shows every variable.

```javascript
function keyPressed() {
  if (key == 'p') {
    noLoop();  // pause
  }
  if (key == 'n') {
    redraw();  // step one frame
  }
  if (key == 'o') {
    loop();    // play
  }
}
```

# Debugging: nothing draws?

- `background()` wipes the whole canvas. Anything drawn before it in `draw()` is gone before you see it.
- `setup` and `draw` are spelled exactly like that. p5 silently ignores `Draw()`.
- Is `sketch.js` loaded? Check the `<script>` tag in `index.html` and the Network tab.
- Is `fill()` the same color as `background()`?
- `noLoop()` in `setup()` means `draw()` runs once.
- Still stuck? Comment out everything in `draw()` and add it back one line at a time.

# Week 7 Assignment: One-button game

Convert a classic arcade game into a one-button game by "automating" (eliminating) interactions that are customarily under control of the player. For example, Space Invaders uses two sets of controls: one to move the player's laser cannon back and forth, and another to fire at descending aliens. It can be changed into a one-button game by making the cannon move back and forth on an automatic schedule.

Your game needs:

- exactly one input: one key, one mouse button, or one touch
- a start state, a playing state and a game over state (see application state)
- a way to win or lose, and a way to play again

Reference: [one button golf](http://hello-world-week7.s3-website-us-east-1.amazonaws.com/examples/p5/one-button-golf-like/) ([source](https://github.com/areaofeffect/hello-world/tree/main/week7/examples/p5/one-button-golf-like)) (press space)
